<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Empty approvals after multi-record zh-CN mobile</title>
</head>
<body data-r4-web-multi-record-case="empty-approvals-multi-zh-mobile" data-r4-web-route="/approvals" data-r4-locale="zh-CN">
  <style>.wh-route-state-matrix{display:grid;gap:16px;min-width:0;max-width:100%}.wh-route-state-row{display:grid;grid-template-columns:160px repeat(4,minmax(0,1fr));gap:12px;align-items:stretch;min-width:0}.wh-route-state-route{border:1px solid #dfe5f1;border-radius:8px;background:#fff;padding:14px;display:grid;align-content:center;gap:6px;min-width:0;overflow-wrap:anywhere}.wh-route-state-route strong{font-size:14px}.wh-route-state-route span{font-size:12px;color:#66728c;overflow-wrap:anywhere}.wh-route-state-card{border:1px solid #dfe5f1;background:rgba(255,255,255,.94);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;box-shadow:0 14px 38px rgba(37,51,79,.07)}.wh-route-state-card[data-route-state=loading]{border-color:#b8c7ff}.wh-route-state-card[data-route-state=empty]{border-color:#dfe8d7}.wh-route-state-card[data-route-state=error]{border-color:#f0c5bd}.wh-route-state-card[data-route-state=forbidden]{border-color:#d8dff2}.wh-route-state-pill{display:inline-flex;align-items:center;max-width:100%;border-radius:999px;background:#f5f8fc;color:#66728c;font-size:11px;font-weight:800;padding:5px 8px;overflow-wrap:anywhere}.wh-route-state-card h3{margin:0;font-size:16px;line-height:1.25;overflow-wrap:anywhere}.wh-route-state-card p{margin:0;color:#66728c;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.wh-route-state-action{display:inline-flex;width:max-content;max-width:100%;align-items:center;justify-content:center;border:1px solid #dfe5f1;border-radius:8px;background:#fff;color:#172033;text-decoration:none;font-weight:800;font-size:12px;padding:8px 10px;overflow-wrap:anywhere}@media (max-width:980px){.wh-route-state-row{grid-template-columns:1fr}.wh-route-state-route{position:sticky;top:0;z-index:1}}body{margin:0;background:#f6f9fd;color:#172033;overflow-x:hidden}.wh-web-route-state-screen{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Aptos","Segoe UI",sans-serif;background:linear-gradient(180deg,#fbfdff 0%,#edf4fb 100%);box-sizing:border-box}.wh-web-route-state-screen,.wh-web-route-state-screen *{box-sizing:border-box}.wh-web-route-state-wrap{width:min(560px,100%);display:grid;gap:12px;min-width:0}.wh-web-route-state-meta{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0;flex-wrap:wrap;color:#66728c;font-size:12px;font-weight:800}.wh-web-route-state-meta span{min-width:0;overflow-wrap:anywhere}</style>
    <main class="wh-web-route-state-screen" data-r4-web-route-status="empty" data-r4-web-route-key="approvals" data-r4-web-route-pattern="/approvals">
      <section class="wh-web-route-state-wrap">
        <div class="wh-web-route-state-meta"><span>WorkHub Web</span><span>/api/pages/approvals</span></div>
        <article class="wh-route-state-card" data-route-key="approvals" data-route-state="empty" data-locale="zh-CN">
    <span class="wh-route-state-pill">/approvals</span>
    <h3>现在没有需要处理的事项</h3>
    <p>空态保持安静，只保留创建、返回或查看历史的入口。</p>
    <a class="wh-route-state-action" href="/">回到总览</a>
  </article>
      </section>
    </main>
  <script>
    (() => {
      const root = document.documentElement;
      document.body.dataset.r4ClientWidth = String(root.clientWidth);
      document.body.dataset.r4ScrollWidth = String(root.scrollWidth);
    })();
  </script>
</body>
</html>

name: verify

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # cargo gate runs in the dedicated rust-system-i18n job with Tauri system deps
      WORKHUB_RUST_I18N_CARGO: skip
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # 插件宿主端到端冒烟（不需要 PG / 不需要模型 key）：起一个 tsx 子进程装 echo 夹具，证明插件工具被 Cuu 调到、结果进轨迹、调用落审计。
      - run: pnpm qa:plugin-smoke
      # MCP 端到端冒烟（不需要 PG / 不需要模型 key）：起一台真的 stdio MCP 夹具服务器子进程，证明
      # 配置一行 → 握手 → 工具进注册表 → Cuu 调到 → 结果（围栏已中和）进轨迹 → 落审计；再把管理员
      # 断言收回最高档，证明同一个调用会停下来转人。
      - run: pnpm qa:mcp-smoke
      # scripts/ 不是 workspace 包，`pnpm test` 的 -r 递归覆盖不到；门禁脚本自身的测试
      # （文案 locale 独占扫描器）在这里单独跑一步。
      - run: pnpm test:scripts

  web-live-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKHUB_QA_CHROME_EXTRA_ARGS: "--no-sandbox --disable-dev-shm-usage"
      # 失败时把每一步等待的标签打到 stderr（否则 CDP 错误只有 websocket 栈，看不出死在哪一步）。
      WORKHUB_QA_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts for deterministic zh-CN text metrics
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli.*' -o -name 'microsoft-prod.*' \) -print -exec sudo mv {} {}.disabled \;
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:r4-web-live-route-interaction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-live-route-smoke-evidence
          path: |
            docs/workhub/05-clients/assets/audit/2026-06-11-r4-web-live-route-interaction/contact-sheet.png
            docs/workhub/05-clients/assets/audit/2026-06-11-r4-web-live-route-interaction/live-route-interaction-report.json
            docs/workhub/05-clients/assets/audit/2026-06-11-r4-web-live-route-interaction/smoke-summary.md
          retention-days: 14

  rust-system-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli.*' -o -name 'microsoft-prod.*' \) -print -exec sudo mv {} {}.disabled \;
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-tauri/src-tauri
      - name: Ensure rustfmt/clippy components
        run: rustup component add rustfmt clippy
      # 注:runner 是 ubuntu-latest。rustfmt 只做语法层排版,不评估 cfg,所以下面 fmt --check
      # 覆盖全部源码,包括 windows.rs/main.rs 里 `#[cfg(target_os = "macos"/"windows")]` 门下的分支。
      # 但 clippy 是真编译再 lint,Linux target 编译期会把那些平台专属分支直接剔除——
      # 因此 clippy 这一步只对 Linux 生效的代码路径生效,macOS/Windows 专属分支的 clippy
      # 仍需在对应平台本机跑(与现有 rust-system-i18n job 里 cargo test 的覆盖范围一致,非本次新增的局限)。
      - name: cargo fmt --check (desktop shell, all cfg branches)
        run: cargo fmt --manifest-path client-tauri/src-tauri/Cargo.toml --check
      - name: cargo clippy -D warnings (desktop shell, Linux cfg paths only)
        run: cargo clippy --manifest-path client-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:r4-rust-system-i18n

  r1-pg-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workhub
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://workhub:workhub@127.0.0.1:5432/workhub
      COOKIE_SECRET: ci-r1-pg-smoke-cookie-secret
      COOKIE_SECURE: "false"
      CORS_ALLOW_ORIGINS: "*"
      BROKER_BACKEND: memory
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:r1-pg-smoke
      # R24-P 阶段 1 的插件治理链（迁移 0072 / 清单 / 启停 / 移除 / 工具注册表 / 审计）。
      # 复用上一步同一个容器与同一份 env——插件清单只来自 plugins 表，不设 WORKHUB_PLUGIN_PATHS。
      - run: pnpm qa:r1-pg-plugin-smoke

  r2-pg-redis-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workhub
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://workhub:workhub@127.0.0.1:5432/workhub
      COOKIE_SECRET: ci-r2-pg-redis-smoke-cookie-secret
      COOKIE_SECURE: "false"
      CORS_ALLOW_ORIGINS: "*"
      BROKER_BACKEND: redis
      BROKER_URL: redis://127.0.0.1:6379
      WORKER_COUNT: "2"
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:r2-pg-redis-smoke

  pilot-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pilot env from template
        run: |
          cp .env.pilot.example .env.pilot
          sed -i 's/^COOKIE_SECRET=.*/COOKIE_SECRET=ci-pilot-cookie-secret-0123456789abcdef/' .env.pilot
          sed -i 's/^ADMIN_CLAIM_SECRET=.*/ADMIN_CLAIM_SECRET=ci-admin-pass/' .env.pilot
      - name: Build and start the pilot stack
        run: docker compose -f docker-compose.pilot.yml up -d --build
      - name: Wait for workhub container health
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f docker-compose.pilot.yml ps -q workhub)" 2>/dev/null || echo starting)
            echo "workhub health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "workhub did not become healthy" >&2
          exit 1
      - name: Smoke the deployed stack
        run: |
          set -euxo pipefail
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"ok":true'
          # 注册屏 SPA：根路径与 deep link 都应返回应用外壳
          curl -fsS http://127.0.0.1:8787/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8787/approvals | grep -q 'id="root"'
          # 管理员注册（admin secret 提权）→ 鉴权后 Page VM 可达
          cookie=$(curl -fsS -D - -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"nickname":"Pilot Admin","admin_secret":"ci-admin-pass"}' \
            http://127.0.0.1:8787/api/auth/identify | grep -i '^set-cookie' | head -1 | sed 's/^[Ss]et-[Cc]ookie: //' | cut -d';' -f1)
          test -n "$cookie"
          curl -fsS -H "Cookie: $cookie" http://127.0.0.1:8787/api/auth/me | grep -q '"is_admin":true'
          curl -fsS -H "Cookie: $cookie" http://127.0.0.1:8787/api/pages/attention >/dev/null
          # 未鉴权 Page VM 必须 fail-closed
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/pages/attention)
          test "$code" = "401" -o "$code" = "403"
      - name: Smoke the sandbox deliverable libraries (R5.11.1)
        run: |
          set -euxo pipefail
          docker compose -f docker-compose.pilot.yml exec -T workhub python3 - << 'PYCHECK'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import pandas as pd
          import numpy as np
          from docx import Document
          from openpyxl import Workbook
          from pptx import Presentation
          from pptx.util import Inches

          # docx
          doc = Document(); doc.add_heading("冒烟", level=0); doc.add_paragraph("中文段落")
          doc.save("/tmp/smoke.docx")
          assert len(Document("/tmp/smoke.docx").paragraphs) >= 1

          # xlsx
          wb = Workbook(); ws = wb.active; ws.append(["项", "值"]); ws.append(["甲", 1])
          wb.save("/tmp/smoke.xlsx")

          # chart with CJK labels
          plt.rcParams["font.sans-serif"] = ["Noto Sans CJK SC", "sans-serif"]
          fig, ax = plt.subplots(figsize=(4, 3))
          ax.bar(["一月", "二月"], [3, 5]); ax.set_title("中文标题")
          fig.savefig("/tmp/smoke.png")
          import os; assert os.path.getsize("/tmp/smoke.png") > 1000

          # pptx
          prs = Presentation(); s0 = prs.slides.add_slide(prs.slide_layouts[0])
          s0.shapes.title.text = "冒烟"
          prs.save("/tmp/smoke.pptx")

          # stats
          df = pd.DataFrame({"g": ["a", "a", "b"], "v": [1.0, 2.0, 4.0]})
          out = df.groupby("g").agg(均值=("v", "mean"))
          assert float(np.round(out.loc["a", "均值"], 2)) == 1.5
          print("sandbox deliverable libraries OK")
          PYCHECK
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.pilot.yml logs --no-color > pilot-stack-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pilot-stack-logs
          path: pilot-stack-logs.txt
          retention-days: 7

  # 安全顾问门（非阻断）：只上报、绝不让 main 变红。pnpm audit 报已知 CVE，外加对已提交私钥的粗扫。
  # continue-on-error: true 在 job 级别兜底；各步骤再加 `|| true`，双保险——预存的依赖告警不会把必需 job 拖红。
  security-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency CVE audit (advisory)
        run: pnpm audit --audit-level high || true
      - name: Secret scan for committed private keys (advisory)
        run: |
          # 只对已跟踪文件扫明显的私钥头；命中即提示，但 `|| true` 保证不阻断。
          if git grep -nI -e "-----BEGIN RSA PRIVATE KEY-----" \
                          -e "-----BEGIN OPENSSH PRIVATE KEY-----" \
                          -e "-----BEGIN DSA PRIVATE KEY-----" \
                          -e "-----BEGIN EC PRIVATE KEY-----" \
                          -e "-----BEGIN PGP PRIVATE KEY BLOCK-----" \
                          -- . ':(exclude)SECURITY.md' ':(exclude).github/workflows/verify.yml'; then
            echo "::warning::Possible committed private key detected — please review (advisory, non-blocking)."
          else
            echo "No obvious committed private keys found."
          fi || true

  migration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workhub
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://workhub:workhub@127.0.0.1:5432/workhub
      WORKHUB_MIGRATION_AUDIT_REQUIRE_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:migrations

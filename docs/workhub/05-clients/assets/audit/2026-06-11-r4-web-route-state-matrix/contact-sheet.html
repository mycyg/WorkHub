<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R4 Web Route State Matrix Contact Sheet</title>
  <style>
    body{margin:0;font-family:"Aptos","Segoe UI",sans-serif;color:#172033;background:#eef4fb;padding:20px}
    h1{margin:0 0 14px;font-size:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    figure{margin:0;background:white;border:1px solid #dfe5f1;border-radius:8px;padding:10px;box-shadow:0 18px 50px rgba(37,51,79,.08)}
    figcaption{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#5e6a86;margin-bottom:8px}
    img{display:block;width:100%;height:auto;border:1px solid #eef2f8;border-radius:6px}
  </style>
</head>
<body>
  <h1>R4 Web Route State Matrix Contact Sheet</h1>
  <main class="grid">
    <figure data-contact-case="ready-zh-desktop"><figcaption><strong>Ready shell zh-CN desktop</strong><span>zh-CN</span></figcaption><img src="ready-zh-desktop.png" alt="Ready shell zh-CN desktop" /></figure><figure data-contact-case="ready-en-mobile"><figcaption><strong>Ready shell en-US mobile</strong><span>en-US</span></figcaption><img src="ready-en-mobile.png" alt="Ready shell en-US mobile" /></figure><figure data-contact-case="states-zh-desktop"><figcaption><strong>Route states zh-CN desktop</strong><span>zh-CN</span></figcaption><img src="states-zh-desktop.png" alt="Route states zh-CN desktop" /></figure><figure data-contact-case="states-en-mobile"><figcaption><strong>Route states en-US mobile</strong><span>en-US</span></figcaption><img src="states-en-mobile.png" alt="Route states en-US mobile" /></figure>
  </main>
</body>
</html>

<!doctype html>
<html lang="en" data-live2d-status="booting">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cuu Tororo Live2D</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgba(0, 0, 0, 0) !important;
      }

      body {
        position: relative;
      }

      .stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: rgba(0, 0, 0, 0) !important;
      }

      .live2d {
        position: absolute;
        left: 50%;
        bottom: -112px;
        width: 210px;
        height: 560px;
        transform: translateX(-50%);
      }

      @media (prefers-reduced-motion: reduce) {
        .live2d {
          opacity: 0.96;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <canvas class="live2d" id="live2d" width="300" height="800"></canvas>
    </div>
    <script src="./live2d.js"></script>
    <script>
      (() => {
        const root = document.documentElement;
        const post = (status, detail) => {
          root.dataset.live2dStatus = status;
          try {
            window.parent.postMessage(
              {
                type: "workhub:cuu-live2d",
                model: "tororo",
                status,
                detail: detail || ""
              },
              "*"
            );
          } catch {}
        };

        window.addEventListener("error", (event) => {
          post("error", event.message || "window error");
        });

        try {
          post("loading");
          loadlive2d("live2d", "./cuu-tororo.model.json");
          window.setTimeout(() => post("running"), 1200);
        } catch (error) {
          post("error", error && error.message ? error.message : String(error));
        }
      })();
    </script>
  </body>
</html>
